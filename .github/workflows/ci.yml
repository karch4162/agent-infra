name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release-pr.yml dispatches this on release/<plugin>: its GITHUB_TOKEN PR's
  # pull_request run waits in action_required for an Approve click, so this is
  # how a release SHA gets tested with no click. The run does not attach to the
  # PR; the release PR body links to it.
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      # Windows spends ~10x Ubuntu's time on the same suites (process spawns for
      # scratch git repos), so it runs as four shards, each on its own runner.
      # Shard k runs every 4th suite in name order; ubuntu runs them all.
      matrix:
        include:
          - { os: ubuntu-latest, shard: 0, shards: 1 }
          - { os: windows-latest, shard: 0, shards: 4 }
          - { os: windows-latest, shard: 1, shards: 4 }
          - { os: windows-latest, shard: 2, shards: 4 }
          - { os: windows-latest, shard: 3, shards: 4 }
    name: tests (${{ matrix.os }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard + 1, matrix.shards) || '' }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Real-time scanning inspects every file the suites' scratch repos create;
      # a throwaway runner doesn't need it.
      - name: Disable Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Suites create scratch git repos; some rely on an ambient identity.
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      - name: Run test suites
        run: |
          failed=()
          i=0
          for suite in tests/test-*.sh; do
            i=$((i + 1))
            [ $(((i - 1) % ${{ matrix.shards }})) -eq ${{ matrix.shard }} ] || continue
            echo "::group::$suite"
            if bash "$suite"; then
              echo "PASS $suite"
            else
              echo "FAIL $suite"
              failed+=("$suite")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'failed suites:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check plugin version bump
        run: bash tools/check-version-bump.sh "origin/${{ github.base_ref }}"
