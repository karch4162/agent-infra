name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release-pr.yml dispatches this on release/<plugin>: its GITHUB_TOKEN PR's
  # pull_request run waits in action_required for an Approve click, so this is
  # how a release SHA gets tested with no click. The run does not attach to the
  # PR; the release PR body links to it.
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Suites create scratch git repos; some rely on an ambient identity.
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      - name: Run test suites
        run: |
          failed=()
          for suite in tests/test-*.sh; do
            echo "::group::$suite"
            if bash "$suite"; then
              echo "PASS $suite"
            else
              echo "FAIL $suite"
              failed+=("$suite")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'failed suites:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check plugin version bump
        run: bash tools/check-version-bump.sh "origin/${{ github.base_ref }}"
